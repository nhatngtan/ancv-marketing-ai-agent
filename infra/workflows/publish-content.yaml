main:
  params: [args]
  steps:
    - initialize:
        assign:
          - results: {}
    - publishIndependently:
        parallel:
          shared: [results]
          for:
            value: target
            in: ${args.targets}
            steps:
              - publishOne:
                  try:
                    steps:
                      - callProvider:
                          call: http.post
                          args:
                            url: ${args.baseUrl + "/v1/publishing/tasks/publish"}
                            auth:
                              type: OIDC
                              audience: ${args.baseUrl}
                            body: ${target}
                          result: response
                      - recordSuccess:
                          assign:
                            - results[target.platform]: ${response.body}
                  except:
                    as: error
                    steps:
                      - recordSafeFailure:
                          assign:
                            - results[target.platform]:
                                status: "needs_action"
                                error: ${error.message}
    - summarize:
        return:
          contentId: ${args.contentId}
          platformResults: ${results}
          note: "Platform failures are isolated; successful publications are not rolled back."
